services:
  postgres:
    image: postgres:16
    container_name: movies_postgres
    environment:
      POSTGRES_USER: ${DB_USER:?falta DB_USER en el .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en el .env}
      POSTGRES_DB: ${DB_NAME:?falta DB_NAME en el .env}
    ports:
      - "${DB_PORT:?falta DB_PORT en el .env}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema/movie.sql:/docker-entrypoint-initdb.d/01-schema.sql

volumes:
  postgres_data: